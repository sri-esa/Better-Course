
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syllabify-backend"
version = "0.1.0"
description = "Syllabify backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pymongo>=4.18.1,<5",
    "dnspython>=2.7.0,<3",
    "httpx>=0.28.0",
    "slowapi>=0.1.9",
    "google-generativeai>=0.8.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
]
dev = [
    "pytest>=8.0.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "mongomock>=4.3.0,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
